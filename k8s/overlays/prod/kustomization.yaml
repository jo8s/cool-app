apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: moetikeenjasaan-prod

resources:
- ../../base

# Only the manual "Promote to prod" workflow (with environment approval) edits
# this tag. Argo CD then syncs prod to match.
images:
- name: app-image
  newName: ghcr.io/jo8s/cool-app
  newTag: 63ce5254d5a32517b2f14f9531d7ca8054d007a7

replicas:
- count: 2
  name: moetikeenjasaan

# Real domain: moetikmnjasaan.nl (+ www). Publicly served via a Cloudflare
# Tunnel (see k8s/cloudflared/ and README). Locally you can still test by
# mapping both hosts to 127.0.0.1 in /etc/hosts.
patches:
  - target:
      kind: Ingress
      name: moetikeenjasaan
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: moetikmnjasaan.nl
      - op: add
        path: /spec/rules/-
        value:
          host: www.moetikmnjasaan.nl
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: moetikeenjasaan
                    port:
                      number: 80
