apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: moetikeenjasaan-dev

resources:
  - ../../base

# CI (deploy-dev job) runs `kustomize edit set image app-image=...:<sha>` here.
images:
  - name: app-image
    newName: ghcr.io/jo8s/cool-app
    newTag: latest

replicas:
  - name: moetikeenjasaan
    count: 1

# Give this environment its own hostname.
patches:
  - target:
      kind: Ingress
      name: moetikeenjasaan
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: dev.localhost
