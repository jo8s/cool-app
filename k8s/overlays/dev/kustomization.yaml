apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: moetikeenjasaan-dev

resources:
- ../../base

# CI (deploy-dev job) runs `kustomize edit set image app-image=...:<sha>` here.
images:
- name: app-image
  newName: ghcr.io/jo8s/cool-app
  newTag: 63ce5254d5a32517b2f14f9531d7ca8054d007a7

replicas:
- count: 1
  name: moetikeenjasaan

# Give this environment its own hostname.
patches:
- patch: |-
    - op: add
      path: /spec/rules/0/host
      value: dev.localhost
  target:
    kind: Ingress
    name: moetikeenjasaan
