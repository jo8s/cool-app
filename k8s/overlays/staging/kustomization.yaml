apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: moetikeenjasaan-staging

resources:
  - ../../base

# CI (promote-staging job) sets this tag automatically after dev.
images:
  - name: app-image
    newName: ghcr.io/jo8s/cool-app
    newTag: latest

replicas:
  - name: moetikeenjasaan
    count: 1

patches:
  - target:
      kind: Ingress
      name: moetikeenjasaan
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: staging.localhost
