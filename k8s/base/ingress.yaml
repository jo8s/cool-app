apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moetikeenjasaan
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    # No host = catch-all, so the app answers at http://localhost/
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moetikeenjasaan
                port:
                  number: 80
