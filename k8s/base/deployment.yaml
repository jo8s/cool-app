apiVersion: apps/v1
kind: Deployment
metadata:
  name: moetikeenjasaan
  labels:
    app: moetikeenjasaan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moetikeenjasaan
  template:
    metadata:
      labels:
        app: moetikeenjasaan
    spec:
      # Pull secret for the private ghcr.io image (created by scripts/setup.sh).
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: app-image        # replaced by kustomize (newName/newTag)
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
