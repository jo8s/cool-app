name: build-test-deploy

# On app changes: run tests, build a multi-arch image, then auto-promote
# dev -> staging via GitOps commits. Prod is a separate, gated workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"        # manifest-only commits (our own tag write-backs) don't rebuild
      - "**.md"
  pull_request:
    branches: [main]   # run tests on every PR (incl. prod-promotion PRs)
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # commit image-tag write-backs
  packages: write        # push to ghcr.io
  pull-requests: write   # open the prod-promotion PR

jobs:
  # 1) Tests + manifest validation gate everything else.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: App tests (structure + coat logic)
        run: node tests/logic.test.mjs
      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Validate all overlays build
        run: |
          for env in dev staging prod; do
            echo "== $env =="
            kustomize build "k8s/overlays/$env" >/dev/null
          done

  # 2) Build + push the image. Only runs if tests pass.
  build:
    needs: test
    # On PRs we only run tests; build/deploy happen after merge to main.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Auto-deploy the fresh image to dev.
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Set dev image tag
        working-directory: k8s/overlays/dev
        run: kustomize edit set image app-image=${{ needs.build.outputs.image }}:${{ github.sha }}
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "dev already on this tag."; exit 0
          fi
          git commit -am "ci(dev): deploy ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push

  # 4) Auto-promote the same image to staging.
  promote-staging:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Set staging image tag
        working-directory: k8s/overlays/staging
        run: kustomize edit set image app-image=${{ needs.build.outputs.image }}:${{ github.sha }}
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "staging already on this tag."; exit 0
          fi
          git commit -am "ci(staging): promote ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push

  # 5) Auto-open a PR that promotes the same image to prod. You review + merge;
  #    Argo CD then syncs prod. This is your manual approval gate.
  open-prod-pr:
    needs: [build, promote-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # includes the staging tag-bump just pushed
      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Set prod image tag
        working-directory: k8s/overlays/prod
        run: kustomize edit set image app-image=${{ needs.build.outputs.image }}:${{ github.sha }}
      - name: Open prod promotion PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: promote-prod          # one rolling PR, updated each pipeline run
          delete-branch: false
          commit-message: "ci(prod): promote ${{ github.sha }}"
          title: "Promote to prod: ${{ github.sha }}"
          body: |
            Auto-generated promotion of the latest staging build to **production**.

            Image: `${{ needs.build.outputs.image }}:${{ github.sha }}`

            Merging this PR updates `k8s/overlays/prod`; Argo CD then syncs the
            `moetikeenjasaan-prod` namespace. Review the diff and merge to deploy.
