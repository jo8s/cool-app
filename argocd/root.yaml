apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # App-of-apps: watch the argocd/ folder and manage every Application /
  # ApplicationSet / Ingress in it (including this root app itself).
  source:
    repoURL: https://github.com/jo8s/cool-app.git
    targetRevision: main
    path: argocd
    directory:
      recurse: false        # all manifests are flat in argocd/
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
