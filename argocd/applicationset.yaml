apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: moetikeenjasaan
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: staging
          - env: prod
  template:
    metadata:
      name: "moetikeenjasaan-{{.env}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/jo8s/cool-app.git
        targetRevision: main
        path: "k8s/overlays/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "moetikeenjasaan-{{.env}}"
      # All three envs follow git. The human gate for prod is the approval on
      # the "Promote to prod" workflow that writes prod's image tag.
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
