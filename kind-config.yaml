kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cool-app
nodes:
  - role: control-plane
    # Label the node so ingress-nginx (kind variant) schedules here.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Map host ports 80/443 to the ingress controller so the app is reachable
    # at http://localhost.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
