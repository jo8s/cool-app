<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moet ik m'n jas aan?</title>
<meta name="description" content="Het antwoord op de belangrijkste vraag van de dag: moet ik m'n jas aan?">
<style>
  :root {
    --bg: #7fb2e6;
    --fg: #ffffff;
    --accent: rgba(255,255,255,0.85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    text-align: center;
    padding: 32px 24px;
    transition: background 0.6s ease;
    overflow-x: hidden;
  }
  .emoji {
    font-size: clamp(64px, 18vw, 140px);
    line-height: 1;
    margin-bottom: 8px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
  }
  .verdict {
    font-size: clamp(40px, 12vw, 110px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 0.95;
    text-shadow: 0 3px 16px rgba(0,0,0,0.18);
  }
  .reason {
    font-size: clamp(18px, 4vw, 28px);
    font-weight: 500;
    margin-top: 18px;
    max-width: 640px;
    opacity: 0.95;
  }
  .details {
    font-size: clamp(13px, 2.6vw, 16px);
    margin-top: 14px;
    opacity: 0.8;
    font-weight: 500;
  }
  .place {
    position: relative;
    margin-top: 34px;
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(255,255,255,0.18);
    border-radius: 999px;
    padding: 6px 6px 6px 18px;
    backdrop-filter: blur(6px);
  }
  .suggest {
    list-style: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    margin: 0;
    padding: 4px;
    background: #fff;
    color: #222;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.22);
    text-align: left;
    display: none;
    z-index: 5;
  }
  .suggest.on { display: block; }
  .suggest li {
    padding: 8px 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  .suggest li:hover, .suggest li[aria-selected="true"] { background: #eef3fb; }
  .suggest li small { display: block; font-weight: 400; opacity: 0.6; font-size: 12px; }
  .place input {
    border: none;
    background: transparent;
    color: var(--fg);
    font-size: 16px;
    font-weight: 600;
    width: 150px;
    outline: none;
  }
  .place input::placeholder { color: rgba(255,255,255,0.7); }
  .place button {
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,0.9);
    color: #333;
    font-weight: 700;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 15px;
    transition: transform 0.1s ease;
  }
  .place button:active { transform: scale(0.94); }
  .geo {
    margin-top: 12px;
    background: none;
    border: none;
    color: var(--fg);
    opacity: 0.8;
    cursor: pointer;
    font-size: 14px;
    text-decoration: underline;
  }
  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
  }
  .footer a { color: inherit; }
  .loading .verdict { opacity: 0.5; }

  /* keep all content above the animated background */
  .emoji, .verdict, .reason, .details, .extras, .hours, .place, .geo, .footer { position: relative; z-index: 2; }

  /* hourly strip (now -> midnight); tap/hover a cell for the actual temp */
  .hours {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    max-width: min(560px, 92vw);
    overflow-x: auto;
    /* top padding leaves room for the tooltip inside the scroll box, so it
       isn't clipped (overflow-x:auto also clips vertically) */
    padding: 32px 4px 8px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .hours::-webkit-scrollbar { display: none; }
  .hour {
    flex: 0 0 auto;
    width: 58px;
    position: relative;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 8px 0;
    color: inherit;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .hour .bar { width: 60%; height: 4px; border-radius: 2px; }
  .hour .hlabel { font-size: 11px; opacity: 0.8; }
  .hour .hemoji { font-size: 18px; line-height: 1.1; }
  .hour .hfeels { font-size: 17px; font-weight: 800; }
  .hour .tip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 6px;
    background: #1f2d44;
    color: #fff;
    font-size: 11px;
    white-space: nowrap;
    padding: 4px 8px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
    z-index: 3;
  }
  .hour:hover .tip, .hour.show .tip { opacity: 1; }
  .extras { margin-top: 14px; font-size: clamp(22px, 5vw, 30px); letter-spacing: 6px; min-height: 1.2em; }

  /* animated weather background */
  #fx { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .drop { position: absolute; top: -12%; width: 2px; height: 12%;
    background: linear-gradient(transparent, rgba(255,255,255,0.55)); border-radius: 2px;
    animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(120vh); } }
  .flake { position: absolute; top: -6%; color: rgba(255,255,255,0.9); user-select: none;
    animation: drift linear infinite; }
  @keyframes drift { to { transform: translateY(112vh) translateX(24px); } }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
  .sun-glow { position: fixed; top: -140px; right: -140px; width: 420px; height: 420px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,244,190,0.55), transparent 62%);
    animation: pulse 6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  .sun-rays { position: fixed; top: -220px; right: -220px; width: 620px; height: 620px;
    background: conic-gradient(from 0deg, transparent 0 12deg, rgba(255,244,190,0.10) 12deg 16deg, transparent 16deg 28deg);
    animation: spin 60s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* night mode: dim the bright gradients */
  body.night::before { content: ""; position: fixed; inset: 0; z-index: 0;
    background: rgba(8, 12, 30, 0.5); pointer-events: none; }

  /* sun + cloud loading animation */
  .loader { display: none; position: relative; width: 120px; height: 92px; margin: 0 auto 8px; }
  .loader.on { display: block; }
  .l-sun { position: absolute; top: 8px; left: 34px; width: 50px; height: 50px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #ffe883, #ffb43d);
    box-shadow: 0 0 22px rgba(255,206,90,0.6); }
  .l-sun::before { content: ""; position: absolute; inset: -14px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 14deg, rgba(255,222,120,0.55) 14deg 18deg, transparent 18deg 30deg);
    animation: l-spin 7s linear infinite; }
  .l-cloud { position: absolute; bottom: 6px; left: 22px; width: 76px; height: 24px;
    background: #fff; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    animation: l-bob 2.6s ease-in-out infinite; }
  .l-cloud::before { content: ""; position: absolute; top: -13px; left: 12px; width: 26px; height: 26px; border-radius: 50%; background: #fff; }
  .l-cloud::after  { content: ""; position: absolute; top: -19px; left: 32px; width: 34px; height: 34px; border-radius: 50%; background: #fff; }
  @keyframes l-spin { to { transform: rotate(360deg); } }
  @keyframes l-bob { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(9px); } }

  /* visible focus for keyboard users */
  .place:focus-within { box-shadow: 0 0 0 3px rgba(255,255,255,0.85); }
  .place button:focus-visible, .geo:focus-visible, .hour:focus-visible {
    outline: 3px solid rgba(255,255,255,0.9);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .drop, .flake, .star, .sun-glow, .sun-rays, .l-sun::before, .l-cloud { animation: none; }
  }
</style>
</head>
<body>
  <div id="fx"></div>
  <div class="loader" id="loader" aria-hidden="true">
    <div class="l-sun"></div>
    <div class="l-cloud"></div>
  </div>
  <div class="emoji" id="emoji" aria-hidden="true">🤔</div>
  <div class="verdict" id="verdict" aria-live="polite">Even kijken…</div>
  <div class="reason" id="reason" aria-live="polite">De lucht wordt geraadpleegd.</div>
  <div class="details" id="details"></div>
  <div class="extras" id="extras"></div>
  <div class="hours" id="hours"></div>

  <div class="place">
    <input id="city" type="text" placeholder="Plaats…" autocomplete="off" aria-label="Plaats"
           role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
    <button id="go">Check</button>
    <ul class="suggest" id="suggest" role="listbox" aria-label="Plaatssuggesties"></ul>
  </div>
  <button class="geo" id="geo">📍 Gebruik mijn locatie</button>

  <div class="footer">Weerdata: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · <span id="quip"></span></div>

<script>
// ---------- Coat logic ----------
// Levels: 0 geen jas, 1 vestje, 2 jas, 3 winterjas, 4 blijf binnen
const LEVELS = [
  { label: "NEE",   sub: "Geen jas",     emoji: "😎", bg: "linear-gradient(160deg,#ffd85e,#ff9e3d)" },
  { label: "VESTJE",sub: "Een vestje",   emoji: "🧥", bg: "linear-gradient(160deg,#9be36b,#4bb36b)" },
  { label: "JA",    sub: "Gewoon een jas",emoji: "🧥", bg: "linear-gradient(160deg,#7fb2e6,#4a7fc0)" },
  { label: "JA!",   sub: "Winterjas",    emoji: "🧣", bg: "linear-gradient(160deg,#6d8bb5,#3a4f6e)" },
  { label: "BLIJF BINNEN", sub: "Serieus", emoji: "🥶", bg: "linear-gradient(160deg,#8fa8c8,#2a3550)" },
];

// Solid accent per level, for the hourly strip's category bar.
const HOUR_COLORS = ["#ff9e3d", "#4bb36b", "#4a7fc0", "#3a4f6e", "#2a3550"];

// WMO weather codes -> {rain, snow, thunder, desc}
function classifyWeather(code) {
  if (code >= 95) return { rain: true, snow: false, thunder: true, desc: "onweer" };
  if (code >= 85) return { rain: false, snow: true, thunder: false, desc: "sneeuwbuien" };
  if (code >= 80) return { rain: true, snow: false, thunder: false, desc: "regenbuien" };
  if (code >= 71) return { rain: false, snow: true, thunder: false, desc: "sneeuw" };
  if (code >= 61) return { rain: true, snow: false, thunder: false, desc: "regen" };
  if (code >= 51) return { rain: true, snow: false, thunder: false, desc: "motregen" };
  if (code >= 45) return { rain: false, snow: false, thunder: false, desc: "mist" };
  if (code >= 1)  return { rain: false, snow: false, thunder: false, desc: "bewolkt" };
  return { rain: false, snow: false, thunder: false, desc: "helder" };
}

// Map a feels-like temperature to a coat level (0 geen jas .. 4 blijf binnen).
function baseLevel(feels) {
  if (feels >= 19) return 0;
  if (feels >= 13) return 1;
  if (feels >= 7) return 2;
  if (feels >= -3) return 3;
  return 4;
}

// What you need at each level, for the day-ahead nuance sentence.
const NEED = ["geen jas", "een vestje", "een jas", "een winterjas", "een winterjas"];

// A few verdict variants per level, picked at random so it feels fresh.
const VERDICTS = [
  ["Lekker weer joh, niks aan de hand.", "Geen jas nodig, geniet ervan.", "Jas? Laat lekker thuis.", "Vandaag jasvrij."],
  ["Een vestje is genoeg.", "Vestjesweer, meer niet.", "Een laagje volstaat.", "Vestje mee en klaar."],
  ["Gewoon een jas.", "Ja, een jas.", "Jas aan, klaar.", "Trek een jas aan."],
  ["Winterjas aan!", "Dikke jas erbij.", "Winterjas, geen twijfel.", "De warme jas mag uit de kast."],
  ["Serieus, blijf binnen.", "Blijf lekker binnen.", "Buiten? Liever niet.", "Kachel aan, deur dicht."],
];
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// Accessory icons based on conditions. Exposed for testing.
function accessories(feels, weather, umbrella, uv) {
  uv = uv || 0;
  const a = [];
  if (feels >= 30) a.push({ icon: "🌊", label: "zwemkleding — neem een duik" });
  if (feels >= 24) a.push({ icon: "🩳", label: "korte broek" });
  if (uv >= 6) a.push({ icon: "🧴", label: "zonnebrand (hoge UV)" });
  if (uv >= 3) a.push({ icon: "🕶️", label: "zonnebril" });
  if (umbrella) a.push({ icon: "☔", label: "paraplu" });
  if (weather.snow) a.push({ icon: "⛄", label: "sneeuwpret" });
  if (feels <= 4) a.push({ icon: "🧣", label: "sjaal / muts" });
  if (feels <= -3) a.push({ icon: "🧤", label: "handschoenen" });
  return a;
}

// Core decision. Exposed for testing.
// `outlook` is optional: { maxFeels, maxHour, minFeels, minHour } for the rest
// of today, used to add a "but it changes later" nuance without changing the
// main verdict (which stays based on *now*).
function decide({ feels, temp, wind, weatherCode, rainSoonProb, outlook, vsYesterday }) {
  const w = classifyWeather(weatherCode);
  // Note: Open-Meteo's apparent_temperature already includes wind chill,
  // so we base the level on feels-like and only *mention* wind, not double-count it.
  let level = baseLevel(feels);

  const reasons = [];
  const windy = wind >= 25;
  if (windy && (temp - feels) >= 3) {
    reasons.push(`het waait flink (${Math.round(wind)} km/u)`);
  }

  // Snow -> at least winterjas
  if (w.snow) { level = Math.max(level, 3); reasons.push(`het ${w.desc}t`); }
  // Rain now -> at least jas + paraplu
  let umbrella = false;
  if (w.rain) { level = Math.max(level, 2); umbrella = true; reasons.push(`het regent (${w.desc})`); }
  // Rain soon -> at least jas, take umbrella
  else if (rainSoonProb >= 60) { level = Math.max(level, 2); umbrella = true; reasons.push(`straks ${rainSoonProb}% kans op regen`); }
  else if (rainSoonProb >= 35) { umbrella = true; reasons.push(`kans op een bui (${rainSoonProb}%)`); }

  return { level, umbrella, weather: w, reasons, feels, temp, wind, outlook: outlook || null, vsYesterday };
}

// Build a short Dutch verdict line. Facts (temp, wind, weather) live in the
// details row and the accessory icons, so this line stays punchy.
function phrase(d) {
  let line = pick(VERDICTS[d.level]);

  // Fun edge cases & easter eggs (later ones take precedence).
  if (d.level === 0 && d.feels >= 25) line = pick(["Een jas?? Ben je gek. 🩳", "Jas bij dit weer? Echt niet. 🩳"]);
  if (d.level === 4 && d.feels <= -5) line = "Doe de deur maar dicht. 🥶";
  if (d.feels >= 30) line = "Vergeet die jas — zwemkleding aan en zo snel mogelijk het water in! 🌊";
  if (d.feels <= -10) line = "IJskoud. Winterjas, muts én een héél goede reden om te gaan. 🥶";
  if (d.wind >= 60) line = "Storm! Zorg dat je jas niet wegwaait. 🌬️";
  if (d.weather && d.weather.thunder) line = "Onweer op komst — laat die jas, blijf lekker binnen. ⛈️";

  // Warmer/colder than yesterday (same hour).
  if (typeof d.vsYesterday === "number") {
    if (d.vsYesterday <= -3) line += " Voelt kouder dan gisteren.";
    else if (d.vsYesterday >= 3) line += " Voelt warmer dan gisteren.";
  }

  // Day-ahead nuance: fire whenever the coat *category* changes later today.
  const o = d.outlook;
  if (o) {
    const nowCat = baseLevel(d.feels);
    const warmerCat = baseLevel(o.maxFeels);   // warmest hour -> fewest layers
    const colderCat = baseLevel(o.minFeels);   // coldest hour -> most layers
    const warmer = warmerCat < nowCat ? { lvl: warmerCat, h: o.maxInHours, at: o.maxHour } : null;
    const colder = colderCat > nowCat ? { lvl: colderCat, h: o.minInHours, at: o.minHour } : null;

    // If both a warmer and colder swing happen, mention whichever comes first.
    let pick = null, dir = null;
    if (warmer && colder) { pick = warmer.h <= colder.h ? warmer : colder; dir = pick === warmer ? "warmer" : "colder"; }
    else if (warmer) { pick = warmer; dir = "warmer"; }
    else if (colder) { pick = colder; dir = "colder"; }

    if (pick) {
      const hu = pick.h === 1 ? "1 uur" : `${pick.h} uur`;
      if (dir === "warmer") {
        line += pick.lvl === 0
          ? ` Over ${hu} (rond ${pick.at}) heb je geen jas meer nodig.`
          : ` Over ${hu} (rond ${pick.at}) is ${NEED[pick.lvl]} al genoeg.`;
      } else {
        line += ` Over ${hu} (rond ${pick.at}) heb je ${NEED[pick.lvl]} nodig.`;
      }
    }
  }
  return line;
}

// ---------- UI wiring ----------
const $ = id => document.getElementById(id);

// Random footer quip. The cold one only joins the pool when it feels < 10°.
const QUIPS = [
  "bij twijfel: gewoon doen",
  "klopt het niet? geef de wolken de schuld",
  "fout advies? dat was de wind",
  "we hadden gelijk tot het ging waaien",
  "er bestaat geen slecht weer, alleen verkeerde kleding",
];
function setQuip(feels) {
  const pool = QUIPS.slice();
  if (typeof feels === "number" && feels < 10) pool.push("koud? dat bouwt karakter");
  $("quip").textContent = pool[Math.floor(Math.random() * pool.length)];
}

// Loading state: show the sun/cloud loader, clear stale content.
function startLoading(msg) {
  $("loader").classList.add("on");
  $("emoji").style.display = "none";
  $("verdict").textContent = "";
  $("reason").textContent = msg || "Weer ophalen…";
  $("details").textContent = "";
  $("extras").innerHTML = "";
  $("hours").innerHTML = "";
}
function stopLoading() {
  $("loader").classList.remove("on");
  $("emoji").style.display = "";
}

function render(place, d, w) {
  stopLoading();
  const L = LEVELS[d.level];
  // Above ~30° feels-like: a playful "go for a swim" verdict overrides level 0.
  const heat = d.feels >= 30;
  const label = heat ? "ZWEMMEN!" : L.label;
  const emoji = heat ? "🏊" : L.emoji;
  document.body.style.background = heat ? "linear-gradient(160deg,#ffcf4d,#ff6a3d)" : L.bg;
  document.body.classList.toggle("night", w.isDay === false);
  $("emoji").textContent = emoji;
  $("verdict").textContent = label;
  $("reason").textContent = phrase(d);
  $("details").textContent =
    `${place} · ${Math.round(d.temp)}° (voelt als ${Math.round(d.feels)}°) · wind ${Math.round(d.wind)} km/u · ${d.weather.desc}`;
  $("extras").innerHTML = accessories(d.feels, d.weather, d.umbrella, w.uv)
    .map(a => `<span role="img" aria-label="${a.label}" title="${a.label}">${a.icon}</span>`).join("");
  renderHours(w.hours);
  setFx(w);
  setQuip(d.feels);
  document.title = `${label} — moet ik m'n jas aan? (${place})`;
}

// Emoji for a WMO weather code (day/night aware).
function weatherEmoji(code, day) {
  if (code >= 95) return "⛈️";
  if (code >= 71 && code <= 77) return "🌨️";
  if (code >= 85) return "🌨️";
  if (code >= 80) return "🌦️";
  if (code >= 61) return "🌧️";
  if (code >= 51) return "🌦️";
  if (code >= 45) return "🌫️";
  if (code >= 3) return "☁️";
  if (code >= 1) return day ? "🌤️" : "☁️";
  return day ? "☀️" : "🌙";   // 0 = clear
}

// Build the hourly strip. Big number = feels-like; tap/hover reveals actual temp.
function renderHours(hours) {
  const el = $("hours");
  if (!hours || !hours.length) { el.innerHTML = ""; return; }
  el.innerHTML = hours.map(h => {
    const color = HOUR_COLORS[baseLevel(h.feels)];
    return `<button class="hour" type="button" aria-label="${h.label}: voelt als ${Math.round(h.feels)}°, werkelijk ${Math.round(h.actual)}°">
      <span class="tip">werkelijk ${Math.round(h.actual)}°</span>
      <span class="bar" style="background:${color}"></span>
      <span class="hlabel">${h.label}</span>
      <span class="hemoji">${weatherEmoji(h.code, h.day)}</span>
      <span class="hfeels">${Math.round(h.feels)}°</span>
    </button>`;
  }).join("");
}

function setError(msg) {
  stopLoading();
  $("emoji").textContent = "🤷";
  $("verdict").textContent = "Geen idee";
  $("reason").textContent = msg;
  $("details").textContent = "";
  $("extras").innerHTML = "";
  $("hours").innerHTML = "";
  setFx(null);
}

// Tap an hour cell to toggle its actual-temp tooltip (hover works on desktop).
$("hours").addEventListener("click", e => {
  const cell = e.target.closest(".hour");
  if (!cell) return;
  const wasShown = cell.classList.contains("show");
  $("hours").querySelectorAll(".hour.show").forEach(c => c.classList.remove("show"));
  if (!wasShown) cell.classList.add("show");
});

// Which weather effect to show for the current conditions.
function fxKind(w) {
  const c = classifyWeather(w.weatherCode);
  if (c.snow) return "snow";
  if (c.rain) return "rain";
  if (w.weatherCode <= 1) return "sun";   // clear / mainly clear
  return "none";
}

// Populate the animated background: rain, snow, sun rays, and/or night stars.
function setFx(w) {
  const fx = $("fx");
  fx.innerHTML = "";
  if (!w) return;
  const isDay = w.isDay !== false;
  const kind = fxKind(w);
  const frag = document.createDocumentFragment();

  if (kind === "rain") {
    for (let i = 0; i < 44; i++) {
      const d = document.createElement("div");
      d.className = "drop";
      d.style.left = Math.random() * 100 + "%";
      d.style.animationDuration = (0.5 + Math.random() * 0.5) + "s";
      d.style.animationDelay = (-Math.random() * 2) + "s";
      d.style.opacity = 0.3 + Math.random() * 0.5;
      frag.appendChild(d);
    }
  } else if (kind === "snow") {
    for (let i = 0; i < 34; i++) {
      const f = document.createElement("div");
      f.className = "flake";
      f.textContent = "❄";
      f.style.left = Math.random() * 100 + "%";
      f.style.fontSize = (8 + Math.random() * 12) + "px";
      f.style.animationDuration = (4 + Math.random() * 5) + "s";
      f.style.animationDelay = (-Math.random() * 6) + "s";
      f.style.opacity = 0.5 + Math.random() * 0.5;
      frag.appendChild(f);
    }
  } else if (kind === "sun" && isDay) {
    const rays = document.createElement("div"); rays.className = "sun-rays"; frag.appendChild(rays);
    const glow = document.createElement("div"); glow.className = "sun-glow"; frag.appendChild(glow);
  }

  // Twinkling stars on any clear-ish night.
  if (!isDay && kind !== "rain" && kind !== "snow") {
    for (let i = 0; i < 40; i++) {
      const s = document.createElement("div");
      s.className = "star";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 70 + "%";
      s.style.animationDuration = (2 + Math.random() * 3) + "s";
      s.style.animationDelay = (-Math.random() * 4) + "s";
      frag.appendChild(s);
    }
  }
  fx.appendChild(frag);
}

async function geocode(name) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=nl&format=json`);
  const j = await r.json();
  if (!j.results || !j.results.length) throw new Error("plaats niet gevonden");
  const g = j.results[0];
  return { lat: g.latitude, lon: g.longitude, label: [g.name, g.admin1].filter(Boolean).join(", ") };
}

// Coordinates -> actual town/village name (Nominatim / OpenStreetMap, free, no
// key). We prefer the settlement fields (village/town/city) over municipality,
// so merged gemeentes like "Midden-Groningen" don't mask the real place.
async function reverseGeocode(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=14&accept-language=nl`);
    const j = await r.json();
    const a = j.address || {};
    return a.village || a.town || a.city || a.suburb || a.municipality || a.county || "";
  } catch {
    return "";
  }
}

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day,uv_index` +
    `&hourly=temperature_2m,apparent_temperature,weather_code,is_day,precipitation_probability` +
    `&past_days=1&forecast_days=1&timezone=auto`;
  const r = await fetch(url);
  const j = await r.json();
  const c = j.current;
  const H = j.hourly || {};
  const times = H.time || [];
  const feelsArr = H.apparent_temperature || [];
  const tempsArr = H.temperature_2m || [];
  const codesArr = H.weather_code || [];
  const dayArr = H.is_day || [];
  const probs = H.precipitation_probability || [];

  // Find "now": the hourly block containing the current time.
  const nowKey = (c.time || "").slice(0, 13);            // YYYY-MM-DDTHH
  let nowIdx = times.findIndex(t => t.slice(0, 13) === nowKey);
  if (nowIdx < 0) nowIdx = times.findIndex(t => t >= (c.time || ""));
  if (nowIdx < 0) nowIdx = 0;
  const today = (c.time || times[nowIdx] || "").slice(0, 10);
  const hoursFromNow = (iso) => Math.max(1, Math.round((Date.parse(iso) - Date.parse(c.time)) / 3600000));

  // Rain chance over the next ~4 hours.
  const rainSoonProb = Math.max(0, ...probs.slice(nowIdx, nowIdx + 4).map(x => x || 0));

  // Hourly strip: now → end of today.
  const hours = [];
  for (let i = nowIdx; i < times.length; i++) {
    if (i > nowIdx && times[i].slice(0, 10) !== today) break;
    hours.push({
      label: i === nowIdx ? "nu" : times[i].slice(11, 16),
      feels: feelsArr[i],
      actual: tempsArr[i],
      code: codesArr[i],
      day: dayArr[i] === undefined ? true : dayArr[i] === 1,
    });
  }

  // Outlook: warmest/coldest feels-like over the rest of today.
  let outlook = null, maxFeels = -Infinity, minFeels = Infinity, maxIso = null, minIso = null;
  for (let i = nowIdx + 1; i < times.length; i++) {
    if (times[i].slice(0, 10) !== today) break;
    const f = feelsArr[i];
    if (f == null) continue;
    if (f > maxFeels) { maxFeels = f; maxIso = times[i]; }
    if (f < minFeels) { minFeels = f; minIso = times[i]; }
  }
  if (maxIso) outlook = {
    maxFeels, maxHour: maxIso.slice(11, 16), maxInHours: hoursFromNow(maxIso),
    minFeels, minHour: minIso.slice(11, 16), minInHours: hoursFromNow(minIso),
  };

  // Feels-like vs. yesterday at the same hour.
  const yFeels = nowIdx >= 24 ? feelsArr[nowIdx - 24] : null;
  const vsYesterday = (yFeels != null && c.apparent_temperature != null)
    ? c.apparent_temperature - yFeels : undefined;

  return {
    hours,
    temp: c.temperature_2m,
    feels: c.apparent_temperature,
    wind: c.wind_speed_10m,
    weatherCode: c.weather_code,
    rainSoonProb,
    outlook,
    vsYesterday,
    isDay: c.is_day === undefined ? true : c.is_day === 1,
    uv: c.uv_index,
  };
}

async function run(name) {
  startLoading(`Weer boven ${name} ophalen…`);
  try {
    const g = await geocode(name);
    const w = await fetchWeather(g.lat, g.lon);
    render(g.label, decide(w), w);
    localStorage.setItem("jas_city", name);
  } catch (e) {
    setError("Kon het weer niet ophalen: " + e.message);
  }
}

async function runCoords(lat, lon, label) {
  startLoading("Weer ophalen…");
  try {
    const w = await fetchWeather(lat, lon);
    render(label, decide(w), w);
  } catch (e) {
    setError("Kon het weer niet ophalen: " + e.message);
  }
}

$("go").addEventListener("click", () => { const v = $("city").value.trim(); if (v) run(v); });
$("city").addEventListener("keydown", e => {
  if (e.key === "Enter") { hideSuggest(); $("go").click(); }
  else if (e.key === "Escape") hideSuggest();
});

// ----- Search suggestions (autocomplete) -----
async function runResult(g) {
  startLoading(`Weer boven ${g.name} ophalen…`);
  try {
    const w = await fetchWeather(g.latitude, g.longitude);
    render([g.name, g.admin1].filter(Boolean).join(", "), decide(w), w);
  } catch (e) {
    setError("Kon het weer niet ophalen: " + e.message);
  }
}
function hideSuggest() {
  const u = $("suggest");
  u.classList.remove("on");
  u.innerHTML = "";
  $("city").setAttribute("aria-expanded", "false");
}
async function loadSuggest(q) {
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=nl&format=json`);
    const j = await r.json();
    const results = j.results || [];
    if (!results.length) { hideSuggest(); return; }
    const u = $("suggest");
    u.innerHTML = results.map((g, i) => {
      const sub = [g.admin1, g.country].filter(Boolean).join(", ");
      return `<li role="option" data-i="${i}">${g.name}${sub ? `<small>${sub}</small>` : ""}</li>`;
    }).join("");
    u._results = results;
    u.classList.add("on");
    $("city").setAttribute("aria-expanded", "true");
  } catch {
    hideSuggest();
  }
}
let suggestTimer;
$("city").addEventListener("input", () => {
  clearTimeout(suggestTimer);
  const q = $("city").value.trim();
  if (q.length < 2) { hideSuggest(); return; }
  suggestTimer = setTimeout(() => loadSuggest(q), 250);
});
$("suggest").addEventListener("click", e => {
  const li = e.target.closest("li");
  if (!li) return;
  const g = $("suggest")._results[+li.dataset.i];
  $("city").value = g.name;
  localStorage.setItem("jas_city", g.name);
  hideSuggest();
  runResult(g);
});
document.addEventListener("click", e => { if (!e.target.closest(".place")) hideSuggest(); });
$("geo").addEventListener("click", () => {
  if (!navigator.geolocation) { setError("Je browser deelt geen locatie."); return; }
  startLoading("Locatie ophalen…");
  navigator.geolocation.getCurrentPosition(
    async p => {
      const name = await reverseGeocode(p.coords.latitude, p.coords.longitude);
      if (name) {
        $("city").value = name;                 // show which place is used
        localStorage.setItem("jas_city", name);
      }
      runCoords(p.coords.latitude, p.coords.longitude, name || "jouw locatie");
    },
    err => {
      const msg = err.code === 1 ? "Je hebt locatietoegang geweigerd. Typ je plaats hierboven."
        : err.code === 3 ? "Locatie ophalen duurde te lang. Probeer opnieuw of typ je plaats."
        : "Kon je locatie niet bepalen. Typ je plaats hierboven.";
      setError(msg);
    },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
  );
});

// Start: last used city, or Amsterdam
const start = localStorage.getItem("jas_city") || "Amsterdam";
$("city").value = start;
setQuip();          // populate the footer immediately, before weather loads
run(start);
</script>
